<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executor Download</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Inter",sans-serif;
    }

    :root{
        --bg:#0b1020;
        --card:#121a2b;
        --card2:#18233a;
        --blue:#3b82f6;
        --cyan:#22d3ee;
        --text:#f8fafc;
        --muted:#94a3b8;
        --green:#10b981;
        --purple:#8b5cf6;
        --pink:#ec4899;
    }

    body{
        min-height:100vh;
        background:
            radial-gradient(circle at top,#7c3aed22 0%,transparent 45%),
            radial-gradient(circle at bottom,#ec489922 0%,transparent 40%),
            radial-gradient(circle at right,#1d4ed822 0%,transparent 45%),
            var(--bg);
        color:var(--text);
        animation: backgroundShift 10s ease-in-out infinite;
    }

    /* LOADING SCREEN */
    #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader.hidden {
        opacity: 0;
        visibility: hidden;
    }

    .loader-content {
        text-align: center;
        width: 80%;
        max-width: 400px;
    }

    .loader-percentage {
        font-size: 5rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--purple), var(--pink), var(--blue), var(--cyan));
        background-size: 300% 300%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 25px;
        animation: gradientShift 2s ease infinite, pulseText 1.2s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(236,72,153,.3);
    }

    @keyframes pulseText {
        0%, 100% {
            transform: scale(1);
            filter: brightness(1);
        }
        50% {
            transform: scale(1.08);
            filter: brightness(1.3);
        }
    }

    .loader-bar-container {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(139,92,246,.2);
    }

    .loader-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--purple), var(--pink), var(--blue), var(--cyan));
        background-size: 300% 100%;
        border-radius: 20px;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 
            0 0 20px rgba(236, 72, 153, 0.6),
            0 0 40px rgba(139, 92, 246, 0.4);
        position: relative;
        animation: gradientShift 3s ease infinite;
    }

    .loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
        0% {
            transform: translateX(-100%);
        }
        100% {
            transform: translateX(100%);
        }
    }

    .loader-text {
        color: var(--muted);
        margin-top: 20px;
        font-size: 0.95rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: fadeInOut 2s ease-in-out infinite;
    }

    @keyframes fadeInOut {
        0%, 100% {
            opacity: 0.5;
        }
        50% {
            opacity: 1;
        }
    }

    /* ANIMATION KEYFRAMES */
    @keyframes backgroundShift {
        0%, 100% {
            background:
                radial-gradient(circle at top,#7c3aed22 0%,transparent 45%),
                radial-gradient(circle at bottom,#ec489922 0%,transparent 40%),
                radial-gradient(circle at right,#1d4ed822 0%,transparent 45%),
                var(--bg);
        }
        50% {
            background:
                radial-gradient(circle at top,#ec489922 0%,transparent 45%),
                radial-gradient(circle at bottom,#7c3aed22 0%,transparent 40%),
                radial-gradient(circle at left,#06b6d422 0%,transparent 45%),
                var(--bg);
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulse {
        0%, 100% {
            box-shadow: 0 0 25px rgba(236,72,153,.35);
        }
        50% {
            box-shadow: 0 0 50px rgba(236,72,153,.65);
        }
    }

    @keyframes pulseBlue {
        0%, 100% {
            box-shadow: 0 0 25px rgba(34,211,238,.35);
        }
        50% {
            box-shadow: 0 0 50px rgba(34,211,238,.65);
        }
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-10px);
        }
    }

    @keyframes gradientShift {
        0%, 100% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
    }

    /* HEADER */
    header{
        padding:60px 20px 30px;
        text-align:center;
        animation: fadeInUp 0.8s ease-out;
    }

    header h1{
        font-size:3rem;
        font-weight:800;
        background:linear-gradient(90deg,var(--purple),var(--pink),var(--blue),var(--cyan));
        background-size: 300% auto;
        -webkit-background-clip:text;
        background-clip: text;
        color:transparent;
        animation: gradientShift 3s ease infinite;
    }

    header p{
        color:var(--muted);
        margin-top:12px;
        animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    /* HERO */
    .hero{
        display:flex;
        justify-content:center;
        align-items:center;
        gap: 30px;
        padding:30px 20px 60px;
        flex-wrap: wrap;
        animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .card{
        width:100%;
        max-width:430px;
        background:rgba(18,26,43,.88);
        backdrop-filter:blur(18px);
        border:1px solid rgba(139,92,246,.25);
        border-radius:24px;
        padding:35px;
        box-shadow:
            0 0 35px rgba(139,92,246,.15),
            inset 0 0 20px rgba(255,255,255,.03);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s infinite;
        pointer-events: none;
        border-radius: 24px;
    }

    .card h2{
        font-size:2rem;
        margin-bottom:12px;
        position: relative;
        display: inline-block;
    }

    .card h2::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 3px;
        animation: lineGrow 1s ease-out 1s forwards;
    }

    .card-pro h2::after {
        background: linear-gradient(90deg, var(--purple), var(--pink));
    }

    .card-client h2::after {
        background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    @keyframes lineGrow {
        to {
            width: 100%;
        }
    }

    .card p{
        color:var(--muted);
        line-height:1.6;
        margin-bottom:28px;
        transition: color 0.3s ease;
    }

    .card p:hover {
        color: var(--text);
    }

    .card-pro {
        border-color: rgba(139,92,246,.25);
        animation: float 6s ease-in-out infinite;
    }

    .card-pro:hover {
        border-color: rgba(139,92,246,.5);
        box-shadow:
            0 0 50px rgba(139,92,246,.25),
            inset 0 0 30px rgba(255,255,255,.05);
    }

    .card-client {
        border-color: rgba(59,130,246,.25);
        animation: float 6s ease-in-out infinite 1s;
    }

    .card-client:hover {
        border-color: rgba(59,130,246,.5);
        box-shadow:
            0 0 50px rgba(59,130,246,.25),
            inset 0 0 30px rgba(255,255,255,.05);
    }

    /* BUTTONS */
    .btn-pro {
        width:100%;
        padding:15px;
        border:none;
        border-radius:14px;
        background:linear-gradient(135deg,var(--purple),var(--pink));
        background-size: 200% 200%;
        color:white;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow:0 0 25px rgba(236,72,153,.35);
        animation: pulse 3s ease-in-out infinite;
        position: relative;
        overflow: hidden;
    }

    .btn-pro::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255,255,255,.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }

    .btn-pro:hover {
        transform:translateY(-3px) scale(1.02);
        box-shadow:0 0 40px rgba(236,72,153,.7);
        background-position: 100% 0%;
        animation: none;
    }

    .btn-client {
        width:100%;
        padding:15px;
        border:none;
        border-radius:14px;
        background:linear-gradient(135deg,var(--blue),var(--cyan));
        background-size: 200% 200%;
        color:white;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow:0 0 25px rgba(34,211,238,.35);
        animation: pulseBlue 3s ease-in-out infinite;
        position: relative;
        overflow: hidden;
    }

    .btn-client::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255,255,255,.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }

    .btn-client:hover {
        transform:translateY(-3px) scale(1.02);
        box-shadow:0 0 40px rgba(34,211,238,.7);
        background-position: 100% 0%;
        animation: none;
    }

    button:active {
        transform: translateY(-1px) scale(0.98);
    }

    button:hover::before {
        width: 300px;
        height: 300px;
    }

    button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        animation: none;
    }

    /* INFO */
    .info{
        display:flex;
        justify-content:space-between;
        align-items: center;
        margin-top:28px;
        padding-top:18px;
        border-top:1px solid rgba(255,255,255,.08);
        color:var(--muted);
        font-size:.9rem;
        animation: fadeInUp 0.6s ease-out 0.6s both;
    }

    .info span {
        transition: all 0.3s ease;
        cursor: default;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .info span:hover {
        transform: translateY(-2px);
    }

    .info-pro span:hover {
        color: var(--pink);
    }

    .info-client span:hover {
        color: var(--cyan);
    }

    .online-dot {
        width: 8px;
        height: 8px;
        background: var(--green);
        border-radius: 50%;
        display: inline-block;
        animation: onlinePulse 2s ease-in-out infinite;
    }

    @keyframes onlinePulse {
        0%, 100% {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        }
        50% {
            box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
        }
    }

    /* FOOTER */
    footer{
        text-align:center;
        padding:25px;
        color:#64748b;
        animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    /* MOBILE */
    @media(max-width:500px){
        header h1{
            font-size:2.3rem;
        }

        .card{
            padding:28px;
            animation: float 4s ease-in-out infinite !important;
        }
        
        button {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .loader-percentage {
            font-size: 3.5rem;
        }
        
        .info {
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }

        .hero {
            padding: 20px 10px 40px;
            gap: 20px;
        }
    }

    @media(max-width:900px) {
        .hero {
            flex-direction: column;
            align-items: center;
        }
    }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loader">
  <div class="loader-content">
    <div class="loader-percentage" id="percentage">0%</div>
    <div class="loader-bar-container">
      <div class="loader-bar" id="loader-bar"></div>
    </div>
    <div class="loader-text">Đang tải web...</div>
  </div>
</div>

<header>
  <h1>Download Delta & Client</h1>
  <p>Mobile Executor & Best Client</p>
</header>

<section class="hero">
  <!-- Card Pro -->
  <div class="card card-pro">
    <h2>Download Delta Lite</h2>
    <p>Tải phiên bản Lite mới nhất.</p>

    <button class="btn-pro" id="downloadBtnPro">Download</button>

    <div class="info info-pro">
      <span>Version: 2.735.1138</span>
      <span>Status: <span class="online-dot"></span> Online</span>
    </div>
  </div>

  <!-- Card Client -->
  <div class="card card-client">
    <h2>Download Delta</h2>
    <p>Tải phiên bản mới nhất.</p>

    <button class="btn-client" id="downloadBtnClient">Download</button>

    <div class="info info-client">
      <span>Version: 2.735.1138</span>
      <span>Status: <span class="online-dot"></span> Online</span>
    </div>
  </div>
</section>

<footer>
  © 2026 Matchat67 - Executor
</footer>

<script>
// Loading animation
window.addEventListener('load', () => {
    const loader = document.getElementById('loader');
    const percentage = document.getElementById('percentage');
    const loaderBar = document.getElementById('loader-bar');
    let progress = 0;
    
    const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 20) + 1;
        
        if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            
            percentage.textContent = progress + '%';
            loaderBar.style.width = progress + '%';
            loaderBar.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
            
            setTimeout(() => {
                loader.classList.add('hidden');
            }, 600);
        } else {
            percentage.textContent = progress + '%';
            loaderBar.style.width = progress + '%';
        }
    }, 250);
});

// Download button Pro - THAY URL CỦA BẠN VÀO ĐÂY
document.getElementById('downloadBtnPro').addEventListener('click', function() {
    const btn = this;
    const originalText = btn.textContent;
    
    btn.disabled = true;
    btn.textContent = 'Đang tải...';
    
    setTimeout(() => {
        btn.textContent = 'Đang chuẩn bị...';
        
        setTimeout(() => {
            // ⬇️ THAY URL CỦA DELTA PRO VÀO ĐÂY ⬇️
            const link = document.createElement('a');
            link.href = 'https://vuotnhanh.com/GraiRoblox'; // 👈 DÁN URL DELTA PRO CỦA BẠN VÀO ĐÂY
            link.download = 'Delta-Pro-v3.245.1782.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            btn.textContent = 'Tải xuống thành công! ✓';
            btn.style.background = 'linear-gradient(135deg, #10b981, #34d399)';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                btn.style.background = '';
            }, 2000);
        }, 1000);
    }, 500);
});

// Download button Client - THAY URL CỦA BẠN VÀO ĐÂY
document.getElementById('downloadBtnClient').addEventListener('click', function() {
    const btn = this;
    const originalText = btn.textContent;
    
    btn.disabled = true;
    btn.textContent = 'Đang tải...';
    
    setTimeout(() => {
        btn.textContent = 'Đang chuẩn bị...';
        
        setTimeout(() => {
            // ⬇️ THAY URL CỦA DELTA CLIENT VÀO ĐÂY ⬇️
            const link = document.createElement('a');
            link.href = 'https://vuotnhanh.com/TbFi'; // 👈 DÁN URL DELTA CLIENT CỦA BẠN VÀO ĐÂY
            link.download = 'Delta-v2.735.1138.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            btn.textContent = 'Tải xuống thành công! ✓';
            btn.style.background = 'linear-gradient(135deg, #10b981, #34d399)';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                btn.style.background = '';
            }, 2000);
        }, 1000);
    }, 500);
});
</script>
</body>
</html>
