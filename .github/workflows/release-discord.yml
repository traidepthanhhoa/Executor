name: GraiExecutor Release Notifications

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

          RELEASE_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/latest")"

          TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name // "unknown"')"
          NAME="$(printf '%s' "$RELEASE_JSON" | jq -r '.name // .tag_name // "Latest release"')"
          URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url // empty')"
          BODY="$(printf '%s' "$RELEASE_JSON" | jq -r '.body // "Không có ghi chú phát hành."')"

          jq -n \
            --arg title "🚀 GraiExecutor: $NAME" \
            --arg tag "$TAG" \
            --arg url "$URL" \
            --arg body "${BODY:0:2500}" \
            '{
              username: "GraiExecutor Release Bot",
              embeds: [{
                title: $title,
                url: $url,
                color: 5793266,
                fields: [{name:"Phiên bản",value:$tag}],
                description: $body,
                footer: {text:"GraiExecutor Release Bot"}
              }]
            }' > payload.json

          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "$DISCORD_WEBHOOK_URL"
