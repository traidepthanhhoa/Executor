<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xác Minh Robot | Matchat67</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #171717;
  --line: #262626;
  --line-strong: #333;
  --text: #fafafa;
  --text-soft: #b0b0b0;
  --muted: #7a7a7a;
  --purple: #a78bfa;
  --pink: #f472b6;
  --green: #34d399;
  --red: #f87171;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(167, 139, 250, .12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(244, 114, 182, .1), transparent 50%);
  pointer-events: none;
  z-index: 0;
}
.verify-wrap {
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  position: relative;
  z-index: 1;
  text-align: center;
  animation: riseIn .5s cubic-bezier(.2, .8, .2, 1);
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.verify-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 24px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 40px rgba(167, 139, 250, .5);
  animation: pulseGlow 2.5s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 30px rgba(167, 139, 250, .4); }
  50% { box-shadow: 0 0 60px rgba(167, 139, 250, .8); }
}
.verify-icon svg { width: 40px; height: 40px; color: #fff; stroke-width: 2.5; }
.verify-title {
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: -.02em;
  color: var(--text);
  margin-bottom: 12px;
  text-transform: uppercase;
}
.verify-sub {
  font-size: .92rem;
  color: var(--text-soft);
  line-height: 1.6;
  margin-bottom: 28px;
}
.captcha-box {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 20px;
  margin-bottom: 20px;
}
.captcha-label {
  display: block;
  font-size: .78rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-bottom: 14px;
}
.captcha-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.captcha-question {
  font-family: "JetBrains Mono", monospace;
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--purple);
  padding: 12px 20px;
  background: var(--surface);
  border: 2px solid var(--purple);
  border-radius: 10px;
  white-space: nowrap;
  box-shadow: 0 0 20px rgba(167, 139, 250, .3);
}
.captcha-input {
  flex: 1;
  min-width: 0;
  max-width: 130px;
  padding: 14px 16px;
  background: var(--surface);
  border: 2px solid var(--line-strong);
  border-radius: 10px;
  color: var(--text);
  font-family: "JetBrains Mono", monospace;
  font-size: 1.3rem;
  font-weight: 800;
  text-align: center;
  outline: none;
  transition: all .2s;
}
.captcha-input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(167, 139, 250, .15);
}
.captcha-input.error {
  border-color: var(--red);
  animation: shake .4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.verify-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 15px 24px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
  border: 0;
  border-radius: 10px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .25s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 8px 24px rgba(167, 139, 250, .4);
}
.verify-btn:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(167, 139, 250, .6);
}
.verify-btn:active { transform: translateY(0); }
.verify-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}
.verify-btn svg {
  width: 20px;
  height: 20px;
  stroke-width: 2.5;
}
.verify-error {
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(248, 113, 113, .1);
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 8px;
  font-size: .82rem;
  display: none;
}
.verify-error.show { display: block; }
.verify-note {
  margin-top: 20px;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  line-height: 1.6;
}
.verify-note strong { color: var(--pink); }
@media (max-width: 500px) {
  .verify-wrap { padding: 32px 22px; }
  .verify-icon { width: 68px; height: 68px; }
  .verify-icon svg { width: 34px; height: 34px; }
  .verify-title { font-size: 1.25rem; }
  .captcha-question { font-size: 1.3rem; padding: 10px 14px; }
  .captcha-input { font-size: 1.1rem; max-width: 100px; }
}
</style>
</head>
<body>

<div class="verify-wrap">
  <div class="verify-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      <polyline points="9 12 11 14 15 10" />
    </svg>
  </div>

  <h1 class="verify-title">🤖 Xác Minh Robot</h1>
  <p class="verify-sub">
    Giải phép tính đơn giản bên dưới để truy cập web.
  </p>

  <div class="captcha-box">
    <label class="captcha-label" for="captchaInput">🔒 Xác minh bạn là người</label>
    <div class="captcha-row">
      <div class="captcha-question" id="captchaQuestion">1 + 1 = ?</div>
      <input
        type="number"
        class="captcha-input"
        id="captchaInput"
        placeholder="?"
        autocomplete="off"
        inputmode="numeric"
      />
    </div>
  </div>

  <button id="verifyBtn" class="verify-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </svg>
    <span>XÁC MINH</span>
  </button>

  <div class="verify-error" id="verifyError"></div>

  <p class="verify-note">
    Sau khi xác minh, web sẽ tự mở khóa.<br>
    <strong>⏱️ Hiệu lực: 7 ngày</strong>
  </p>
</div>

<script>
// ============ CONFIG ============
const VERIFY_CONFIG = {
  webUrl: 'https://kenhmatchat-executor.vercel.app/',
  storageKey: 'matchat_verified_until',
  durationMs: 7 * 24 * 60 * 60 * 1000 // 7 ngày
};

// ============ ĐÃ VERIFY RỒI → VÀO WEB ============
const verifiedUntil = parseInt(localStorage.getItem(VERIFY_CONFIG.storageKey) || '0', 10);
if (Date.now() < verifiedUntil) {
  window.location.replace(VERIFY_CONFIG.webUrl);
}

// ============ TẠO CAPTCHA ============
let captchaAnswer = 0;

function generateCaptcha() {
  const ops = ['+', '-', '×'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, result;

  if (op === '+') {
    a = Math.floor(Math.random() * 9) + 1;
    b = Math.floor(Math.random() * 9) + 1;
    result = a + b;
  } else if (op === '-') {
    a = Math.floor(Math.random() * 8) + 3;
    b = Math.floor(Math.random() * 5) + 1;
    if (a < b) [a, b] = [b, a];
    result = a - b;
  } else {
    a = Math.floor(Math.random() * 4) + 1;
    b = Math.floor(Math.random() * 4) + 1;
    result = a * b;
  }

  captchaAnswer = result;
  document.getElementById('captchaQuestion').textContent = `${a} ${op} ${b} = ?`;
  document.getElementById('captchaInput').value = '';
  document.getElementById('captchaInput').classList.remove('error');
  document.getElementById('verifyError').classList.remove('show');
}

// ============ HANDLE XÁC MINH ============
const verifyBtn = document.getElementById('verifyBtn');
const captchaInput = document.getElementById('captchaInput');
const errorEl = document.getElementById('verifyError');

function submitVerify() {
  const userAnswer = parseInt(captchaInput.value, 10);
  
  if (isNaN(userAnswer)) {
    errorEl.textContent = '❌ Vui lòng nhập đáp án';
    errorEl.classList.add('show');
    captchaInput.classList.add('error');
    captchaInput.focus();
    return;
  }

  if (userAnswer === captchaAnswer) {
    // Đúng → lưu + vào web
    localStorage.setItem(
      VERIFY_CONFIG.storageKey,
      String(Date.now() + VERIFY_CONFIG.durationMs)
    );
    errorEl.classList.remove('show');
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<span>✅ Đang vào web...</span>';
    setTimeout(() => {
      window.location.replace(VERIFY_CONFIG.webUrl);
    }, 500);
  } else {
    // Sai → hiện lỗi + tạo câu mới
    errorEl.textContent = '❌ Sai đáp án. Thử lại câu khác!';
    errorEl.classList.add('show');
    captchaInput.classList.add('error');
    setTimeout(() => {
      generateCaptcha();
      captchaInput.focus();
    }, 800);
  }
}

verifyBtn.addEventListener('click', submitVerify);

captchaInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitVerify();
  }
});

captchaInput.addEventListener('input', () => {
  captchaInput.classList.remove('error');
});

// ============ NÚT TEST ẨN (Ctrl+Shift+V) ============
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'v') {
    e.preventDefault();
    localStorage.setItem(
      VERIFY_CONFIG.storageKey,
      String(Date.now() + VERIFY_CONFIG.durationMs)
    );
    window.location.replace(VERIFY_CONFIG.webUrl);
  }
});

// ============ INIT ============
generateCaptcha();
captchaInput.focus();
</script>

</body>
</html>
