<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xác minh – Matchat67 Executor</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gate">
  <h1>Xác minh nhanh</h1>
  <p>Giải phép tính để vào trang. Bạn chỉ cần làm lại sau 7 ngày.</p>
  <div class="q" id="question" aria-live="polite"></div>
  <label class="sr-only" for="ans">Đáp án</label>
  <input id="ans" type="number" inputmode="numeric" autocomplete="off">
  <label class="chk"><input type="checkbox" id="agree"> <span>Tôi đồng ý với điều khoản và hiểu rằng dùng executor có thể bị khóa tài khoản Roblox.</span></label>
  <div class="err" id="err" role="alert"></div>
  <button class="get" id="go" type="button" disabled>Vào trang</button>
</main>
<script>
(function(){
  var KEY='matchat_verified_until', HOME='index.html', DAYS=7;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  if (Date.now() < parseInt(get(KEY)||'0',10)) { location.replace(HOME); return; }
  var ans=document.getElementById('ans'), err=document.getElementById('err'), go=document.getElementById('go'), agree=document.getElementById('agree'), expected=0;
  function make(){
    var a=Math.floor(Math.random()*9)+1, b=Math.floor(Math.random()*9)+1, op=['+','-','×'][Math.floor(Math.random()*3)];
    if(op==='-'&&a<b){var t=a;a=b;b=t}
    expected = op==='+'?a+b:op==='-'?a-b:a*b;
    document.getElementById('question').textContent=a+' '+op+' '+b+' = ?';
    ans.value=''; ans.classList.remove('bad'); err.textContent='';
  }
  function submit(){
    if(!agree.checked){err.textContent='Hãy tick đồng ý điều khoản.';return}
    if(ans.value===''){err.textContent='Nhập đáp án của phép tính.';ans.focus();return}
    if(parseInt(ans.value,10)!==expected){err.textContent='Đáp án chưa đúng, phép tính mới đã được tạo.';ans.classList.add('bad');make();ans.focus();return}
    try{localStorage.setItem(KEY,String(Date.now()+DAYS*864e5))}catch(e){}
    location.replace(HOME);
  }
  agree.addEventListener('change',function(){go.disabled=!agree.checked});
  go.addEventListener('click',submit);
  ans.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit()}});
  make(); ans.focus();
})();
</script>
</body>
</html>
